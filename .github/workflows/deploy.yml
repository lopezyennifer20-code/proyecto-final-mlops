name: Deploy to Azure Container Apps

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Azure Login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Login al registro
      uses: docker/login-action@v3
      with:
        registry: ${{ secrets.REGISTRY_LOGIN_SERVER }}
        username: ${{ secrets.REGISTRY_USERNAME }}
        password: ${{ secrets.REGISTRY_PASSWORD }}

    - name: Build and push imagen
      run: |
        docker build . -t ${{ secrets.REGISTRY_LOGIN_SERVER }}/mlops-app:${{ github.sha }}
        docker push ${{ secrets.REGISTRY_LOGIN_SERVER }}/mlops-app:${{ github.sha }}

    - name: Desplegar en Container Apps
      run: |
        az containerapp registry set \
          --name ca-proyecto-final \
          --resource-group rg-mlops-final \
          --server ${{ secrets.REGISTRY_LOGIN_SERVER }} \
          --username ${{ secrets.REGISTRY_USERNAME }} \
          --password ${{ secrets.REGISTRY_PASSWORD }}
        az containerapp update \
          --name ca-proyecto-final \
          --resource-group rg-mlops-final \
          --image ${{ secrets.REGISTRY_LOGIN_SERVER }}/mlops-app:${{ github.sha }} \
          --set-env-vars "DATABRICKS_URL=${{ secrets.DATABRICKS_URL }}" "DATABRICKS_TOKEN=${{ secrets.DATABRICKS_TOKEN }}"
